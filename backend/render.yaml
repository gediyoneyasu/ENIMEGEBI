services:
  - type: web
    name: enimegebi-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://enimegebi-zorz.vercel.app
